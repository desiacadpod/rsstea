name: Run Tweet Filter

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"

  # Allows manually running from the Actions tab
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweetapi

      - name: Run script
        env:
          TWEETAPI_KEY: ${{ secrets.TWEETAPI_KEY }}
        run: python tweets.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tweets.json tweets_raw.json

          git diff --cached --quiet || (
            git commit -m "Update tweets - $(date)"
            git push
          )
