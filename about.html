<!DOCTYPE html>
<html>
  <head>
    <title>About - Desi Academia Podcast</title>
    <meta
      name="description"
      content="About Desi Academia Podcast"
    />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="icon" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="rdx" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" type="text/css" />
    <style>
      #about-content {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        line-height: 1.6;
      }
      #about-content {
        color: #e0e0e0;
      }
      #about-content h1 {
        font-size: 2.5em;
        margin-bottom: 0.5em;
        color: #ffffff;
      }
      #about-content h2 {
        font-size: 1.8em;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: #e0e0e0;
        border-bottom: 2px solid #fcb91d;
        padding-bottom: 0.3em;
      }
      #about-content p {
        margin-bottom: 1em;
        color: #e0e0e0;
      }
      #about-content ul {
        margin-left: 2em;
        margin-bottom: 1em;
      }
      #about-content li {
        margin-bottom: 0.5em;
        color: #e0e0e0;
      }
      #about-content a {
        color: #fcb91d;
        text-decoration: none;
      }
      #about-content a:hover {
        text-decoration: underline;
      }
      #about-content strong {
        color: #fcb91d;
      }
      #about-content hr {
        margin: 2em 0;
        border: none;
        border-top: 1px solid #fcb91d;
      }
    </style>
  </head>
  <body>
    <div id="header">Desi Academia Podcast</div>

    <div id="pcwrap">
      <!-- Sidebar container: logo above navigation panel -->
      <div id="sidebar-container">
        <!-- Logo container -->
        <div id="logo-container">
          <img
            src="https://raw.githubusercontent.com/desiacadpod/rsstea/main/desi-academic-podcast.png"
            alt="Desi Academia Podcast"
          />
        </div>

        <!-- Navigation panel -->
        <div id="filter">
          <div class="pclogo">Desi Academia Podcast</div>
          <span id="filters">
            <span style="display: block; padding: 10px; text-align: center; font-weight: bold;">About</span>
            <a href="episodes.html" style="display: block; padding: 10px; text-align: center; color: #fcb91d; text-decoration: none; border-bottom: 1px solid #ddd;">Episodes</a>
            <a href="recommendations.html" style="display: block; padding: 10px; text-align: center; color: #fcb91d; text-decoration: none; border-bottom: 1px solid #ddd;">Recommendations</a>
            <a href="tweets.html" style="display: block; padding: 10px; text-align: center; color: #fcb91d; text-decoration: none; border-bottom: 1px solid #ddd;">Tweets</a>
          </span>
        </div>
      </div>

      <script>
        window.addEventListener("DOMContentLoaded", () => {
          const sidebar = document.getElementById("sidebar-container");
          if (!sidebar) {
            console.error("sidebar-container not found");
            return;
          }

          fetch("feed.json")
            .then((resp) => resp.json())
            .then((data) => {
              if (!data.episodes || data.episodes.length === 0) {
                console.warn("No episodes found in feed.json");
                return;
              }

              const firstLink = data.episodes[0].link || "";

              let podcastName = "podcast";
              const match = firstLink.match(/\/pod\/show\/([^\/]+)\//);
              if (match && match[1]) podcastName = match[1];

              const safeName = podcastName
                .toLowerCase()
                .replace(/[^a-z0-9_-]/g, "_");
              const logoFile = safeName + ".png";

              let logoContainer = document.getElementById("logo-container");
              if (!logoContainer) {
                logoContainer = document.createElement("div");
                logoContainer.id = "logo-container";
                sidebar.insertBefore(logoContainer, sidebar.firstChild);
              }

              fetch(logoFile, { method: "HEAD" })
                .then((res) => {
                  if (res.ok) {
                    const img = document.createElement("img");
                    img.src = logoFile;
                    img.alt = podcastName;
                    img.style.maxWidth = "140px";
                    logoContainer.appendChild(img);
                  }
                })
                .catch((err) =>
                  console.error("Error checking logo file:", err)
                );
            })
            .catch((err) => console.error("Failed to load feed.json:", err));
        });
      </script>
      <!-- About content -->
      <div id="about-content">
        <!-- about content here -->
      </div>
    </div>
    <!-- end pcwrap -->
  </body>
</html>
